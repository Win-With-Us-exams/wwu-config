name: Keep Streamlit admin awake
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours, all day
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Visit and wake
        run: |
          cat > w.py <<'P'
          import asyncio
          from playwright.async_api import async_playwright
          URL = "https://win-with-us-app.streamlit.app/"
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page()
                  await pg.goto(URL, wait_until="domcontentloaded", timeout=90000)
                  await pg.wait_for_timeout(8000)
                  btn = pg.get_by_role("button", name="Yes, get this app back up!")
                  if await btn.count():
                      print("asleep -> waking"); await btn.first.click()
                      await pg.wait_for_timeout(60000)
                  else:
                      print("awake")
                  await pg.wait_for_timeout(20000)
                  await b.close()
          asyncio.run(main())
          P
          python w.py
