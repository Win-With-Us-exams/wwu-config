name: Keep server awake
# GitHub skips most short-interval cron runs, so each run stays alive and
# pings every 14 min itself until the day window ends (~10:30 PM IST).
on:
  schedule:
    - cron: "0 1 * * *"     # 6:30 AM IST
    - cron: "40 1 * * *"    # backup start
    - cron: "0 6 * * *"     # relay (job limit is 6h)
    - cron: "0 11 * * *"    # relay
    - cron: "30 13 * * *"   # backup relay
  workflow_dispatch:
concurrency:
  group: keepalive
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping every 14 minutes until 17:00 UTC
        run: |
          start=$(date +%s)
          while true; do
            ok=0
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://win-with-us-api.onrender.com/ping)
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "try $i got $code"; sleep 10
            done
            echo "$(date -u +%H:%M) ping ok=$ok"
            h=$(date -u +%H); el=$(( $(date +%s) - start ))
            if [ "$h" -ge 17 ] || [ "$el" -gt 20400 ]; then echo "window done"; exit 0; fi
            sleep 840
          done
